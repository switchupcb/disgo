run:
  timeout: 5m
  tests: false

linters:
  fast: false
  enable-all: true
  disable:
    - depguard
    - gochecknoglobals
    - gofumpt
    - unused
    - varnamelen
    - wsl

    - tenv # Deprecated
    - gci # Error

linters-settings:
  revive:
    rules:
      - name: var-naming
        disabled: true # Flags defined by Discord.
        arguments:
          - [] # AllowList
          - [] # DenyList

  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment # Completed at bundle-time.